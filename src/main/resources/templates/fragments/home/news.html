<section th:fragment="news" class="newsletter section" id="newsletter">
    <div class="container">
        <div class="newsletter__inner fade-up">
            <div class="newsletter__img">
                <img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=700" alt="Pool villa" />
            </div>
            <div class="newsletter__content">
                <h2 class="section-title">Get special offers,<br/>and more from travelworld</h2>
                <form class="newsletter__form" id="newsletterForm">
                    <input type="email" name="email" placeholder="Enter your email" required />
                    <button type="submit" class="btn btn-primary">Subscribe</button>
                </form>
                <p class="newsletter__note">No spam, unsubscribe anytime.</p>
            </div>
        </div>
    </div>
</section>
